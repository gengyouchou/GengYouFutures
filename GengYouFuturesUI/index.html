<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Futures Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        canvas {
            width: 100%;
            height: 500px;
            margin: 20px auto;
        }

        #data-container {
            display: none;
        }

        .message-item {
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            background-color: #fff;
        }

        .error-message {
            color: red;
            font-weight: bold;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Real-time Futures Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <canvas id="chart"></canvas>
    <div id="log"></div>
    <div id="data-container"></div>

    <script>
        const logDiv = document.getElementById("log");
        const chartCtx = document.getElementById("chart").getContext("2d");
        const dataContainer = document.getElementById("data-container");
        const priceChangeDiv = document.getElementById("price-change");

        const chartData = {
            labels: [],
            datasets: [{
                label: "Price",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                borderWidth: 2,
                fill: true,
            }]
        };

        const lineChart = new Chart(chartCtx, {
            type: "line",
            data: chartData,
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true }
                },
                scales: {
                    x: { title: { display: true, text: "Message Index" } },
                    y: { title: { display: true, text: "Price" } }
                }
            }
        });

        // 檢查 localStorage 中是否有儲存的圖表資料
        function loadChartData() {
            const savedData = localStorage.getItem('chartData');
            if (savedData) {
                const parsedData = JSON.parse(savedData);
                if (parsedData && parsedData.labels && parsedData.datasets) {
                    chartData.labels = parsedData.labels;
                    chartData.datasets = parsedData.datasets;
                    lineChart.update(); // 更新圖表
                    console.log("Loaded chart data from localStorage:", parsedData);
                }
            }
        }

        async function fetchData() {
            try {
                const response = await fetch("http://localhost:8080/");
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                appendLog("Error fetching data: " + error.message, true);
                alert("Unable to fetch data, retrying in 5 seconds...");
                setTimeout(fetchData, 5000);
            }
        }

        function updateUI(data) {
            dataContainer.innerHTML = ""; // 清空資料輸出區域
            if (Array.isArray(data?.data)) {
                let latestPrice = processMessages(data.data);
                updatePriceChange(latestPrice);
            } else {
                appendLog("Error: Data format invalid.", true);
            }
            lineChart.update();
            saveChartData(); // 更新完數據後儲存
        }

        function processMessages(messages) {
            let latestPrice = null;
            messages.forEach((msg, index) => {
                const { time, price, volume, symbol } = msg;
                if (time && price != null && volume != null && symbol) {
                    appendLog(`Msg #${index + 1}: ${symbol} - $${price} Vol: ${volume} at ${time}`);
                    chartData.labels.push(`Msg #${index + 1}`);
                    chartData.datasets[0].data.push(price);
                    latestPrice = price;
                } else {
                    appendLog(`Incomplete data at Msg #${index + 1}`, true);
                }
            });
            return latestPrice;
        }

        function updatePriceChange(latestPrice) {
            if (latestPrice != null) {
                priceChangeDiv.textContent = `Price Change: ${latestPrice}`;
                priceChangeDiv.style.color = "black";
            }
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.classList.add("error-message");
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 儲存圖表數據到 localStorage
        function saveChartData() {
            const savedData = {
                labels: chartData.labels,
                datasets: chartData.datasets,
            };
            localStorage.setItem('chartData', JSON.stringify(savedData));
            console.log("Chart data saved to localStorage:", savedData);
        }

        setInterval(fetchData, 3000);
        fetchData();
        loadChartData(); // 頁面加載時從 localStorage 更新資料
    </script>
</body>

</html>
