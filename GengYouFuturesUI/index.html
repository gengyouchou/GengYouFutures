<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Futures Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        canvas {
            max-width: 100%;
            margin: 20px auto;
        }

        #data-container {
            margin-top: 20px;
        }

        .message-item {
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            background-color: #fff;
        }

        .error-message {
            color: red;
            font-weight: bold;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Real-time Futures Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <canvas id="chart"></canvas>
    <div id="log"></div>
    <div id="data-container"></div>

    <script>
        const logDiv = document.getElementById("log");
        const chartCtx = document.getElementById("chart").getContext("2d");
        const dataContainer = document.getElementById("data-container");
        const priceChangeDiv = document.getElementById("price-change");

        // Chart setup
        const chartData = {
            labels: [],
            datasets: [{
                label: "Price",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                borderWidth: 2,
                fill: true,
            }]
        };

        const chartOptions = {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                },
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Message Index"
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: "Price"
                    }
                }
            }
        };

        const lineChart = new Chart(chartCtx, {
            type: "line",
            data: chartData,
            options: chartOptions,
        });

        // Fetch and update data
        async function fetchData() {
            console.log("Fetching data...");
            try {
                const response = await fetch("http://localhost:8080/");
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                updateUI(data);
            } catch (error) {
                appendLog("Error fetching data: " + error.message, true);
                console.error("Error fetching data:", error);

                // Retry after 5 seconds
                setTimeout(fetchData, 5000);
            }
        }

        function updateUI(data) {
            console.log("Updating UI with new data...");

            // Clear the container for new updates
            dataContainer.innerHTML = "";

            if (data && Array.isArray(data.data)) {
                let latestPrice = null; // For price change calculation

                data.data.forEach((message, index) => {
                    console.log(`Processing message #${index + 1}`);
                    const { time, price, volume, symbol } = message;

                    if (!time || price == null || volume == null || !symbol) {
                        console.warn(`Incomplete data in message #${index + 1}:`, message);
                        appendLog(`Warning: Incomplete data in message #${index + 1}: ${JSON.stringify(message)}`);
                        return;
                    }

                    // Append log
                    appendLog(`Message #${index + 1}: Symbol: ${symbol}, Price: ${price}, Volume: ${volume}, Time: ${time}`);

                    // Update chart
                    chartData.labels.push(`Msg #${index + 1}`);
                    chartData.datasets[0].data.push(price);

                    // Limit chart data
                    if (chartData.labels.length > 50) {
                        chartData.labels.shift();
                        chartData.datasets[0].data.shift();
                    }

                    // Update latest price
                    latestPrice = price;

                    // Add message to UI
                    const messageElement = document.createElement("div");
                    messageElement.classList.add("message-item");
                    messageElement.innerHTML = `
                        <div><strong>Symbol:</strong> ${symbol}</div>
                        <div><strong>Price:</strong> ${price}</div>
                        <div><strong>Volume:</strong> ${volume}</div>
                        <div><strong>Time:</strong> ${time}</div>
                    `;
                    dataContainer.appendChild(messageElement);
                });

                // Update price change
                if (latestPrice != null) {
                    const previousPrice = chartData.datasets[0].data.slice(-2, -1)[0] || latestPrice;
                    const priceDiff = (latestPrice - previousPrice).toFixed(2);
                    const color = priceDiff > 0 ? "green" : priceDiff < 0 ? "red" : "black";

                    priceChangeDiv.textContent = `Price Change: ${priceDiff}`;
                    priceChangeDiv.style.color = color;
                }
            } else {
                console.error("Fetched data is not in the expected format:", data);
                appendLog("Error: Fetched data is not in the expected format.");
            }

            console.log("UI updated with new data!");
            lineChart.update(); // Refresh the chart
        }

        function appendLog(message, isError = false) {
            const logEntry = document.createElement("div");
            logEntry.textContent = message;
            if (isError) logEntry.classList.add("error-message");
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Fetch data periodically
        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>

</html>
