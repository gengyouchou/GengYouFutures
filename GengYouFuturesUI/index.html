<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Futures Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        canvas {
            width: 100%;
            height: 500px;
            margin: 20px auto;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }

        .product {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .product h2 {
            margin-top: 0;
        }

        pre {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>Real-time Futures Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <canvas id="chart"></canvas>
    <div id="log"></div>
    <h2>Bid/Offer Data Viewer</h2>
    <div id="data-container"></div>

    <script>
        const logDiv = document.getElementById("log");
        const chartCtx = document.getElementById("chart").getContext("2d");
        const priceChangeDiv = document.getElementById("price-change");
        const dataContainer = document.getElementById("data-container");

        const chartData = {
            labels: [],
            datasets: [{
                label: "Current Price",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                borderWidth: 2,
                fill: true,
            }]
        };

        const lineChart = new Chart(chartCtx, {
            type: "line",
            data: chartData,
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true }
                },
                scales: {
                    x: { title: { display: true, text: "Time" } },
                    y: { title: { display: true, text: "Price" } }
                }
            }
        });

        function loadChartData() {
            const savedData = localStorage.getItem("chartData");
            if (savedData) {
                const parsedData = JSON.parse(savedData);
                chartData.labels = parsedData.labels || [];
                chartData.datasets[0].data = parsedData.datasets[0].data || [];
                lineChart.update();
            }
        }

        function saveChartData() {
            const dataToSave = {
                labels: chartData.labels,
                datasets: chartData.datasets
            };
            localStorage.setItem("chartData", JSON.stringify(dataToSave));
        }

        async function fetchData() {
            try {
                const indexDataResponse = await fetch("http://192.168.50.168:8080/index-data");
                if (!indexDataResponse.ok) throw new Error(`HTTP status: ${indexDataResponse.status}`);
                const indexData = await indexDataResponse.json();

                const bidOfferDataResponse = await fetch("http://192.168.50.168:8080/bid-offer-data");
                if (!bidOfferDataResponse.ok) throw new Error(`HTTP status: ${bidOfferDataResponse.status}`);
                const bidOfferData = await bidOfferDataResponse.json();

                updateUI(indexData, bidOfferData);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog("Error fetching data: " + error.message, true);
                setTimeout(fetchData, 5000);
            }
        }

        function updateUI(indexData, bidOfferData) {
            const { CurrentPrice, Timestamp, ClosedProfitLoss, FutureRight } = indexData;
            const timeLabel = new Date(Timestamp * 1000).toLocaleTimeString();
            chartData.labels.push(timeLabel);
            chartData.datasets[0].data.push(CurrentPrice);
            lineChart.update();

            saveChartData();

            priceChangeDiv.textContent = `Price Change: $${CurrentPrice} | Closed Profit: $${ClosedProfitLoss} | Future Right: $${FutureRight}`;

            appendLog(`[Futures] Time: ${timeLabel}, Price: $${CurrentPrice}, Closed Profit: $${ClosedProfitLoss}`);
            renderData(bidOfferData);
        }

        function renderData(data) {
            dataContainer.innerHTML = "";

            // 檢查是否為有效的物件
            if (!data || typeof data !== "object" || !data.BidOffer) {
                appendLog("Invalid bidOfferData structure", true);
                return;
            }

            const productDiv = document.createElement("div");
            productDiv.className = "product";

            const { BidOffer, CurrentPrice, High, Low, Open, ProductName } = data;

            const totalBidVolume = Object.values(BidOffer)
                .filter((entry, index) => index < 5) // 前五個是 Bid
                .reduce((sum, entry) => sum + entry.Volume, 0);

            const totalOfferVolume = Object.values(BidOffer)
                .filter((entry, index) => index >= 5) // 後五個是 Offer
                .reduce((sum, entry) => sum + entry.Volume, 0);

            const html = `
        <h2>${ProductName}</h2>
        <pre>
Open: ${Open}, High: ${High}, Low: ${Low}, Current Price: ${CurrentPrice}
Total Offer Volume: ${totalOfferVolume}
-------------------------------------------------
Ask5: [${BidOffer.Offer5.Price}]: [${BidOffer.Offer5.Volume}]
Ask4: [${BidOffer.Offer4.Price}]: [${BidOffer.Offer4.Volume}]
Ask3: [${BidOffer.Offer3.Price}]: [${BidOffer.Offer3.Volume}]
Ask2: [${BidOffer.Offer2.Price}]: [${BidOffer.Offer2.Volume}]
Ask1: [${BidOffer.Offer1.Price}]: [${BidOffer.Offer1.Volume}]
=============================
Bid1: [${BidOffer.Bid1.Price}]: [${BidOffer.Bid1.Volume}]
Bid2: [${BidOffer.Bid2.Price}]: [${BidOffer.Bid2.Volume}]
Bid3: [${BidOffer.Bid3.Price}]: [${BidOffer.Bid3.Volume}]
Bid4: [${BidOffer.Bid4.Price}]: [${BidOffer.Bid4.Volume}]
Bid5: [${BidOffer.Bid5.Price}]: [${BidOffer.Bid5.Volume}]
-------------------------------------------------
Total Bid Volume: ${totalBidVolume}
        </pre>
    `;
            productDiv.innerHTML = html;
            dataContainer.appendChild(productDiv);
        }


        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        setInterval(fetchData, 3000);
        fetchData();
        loadChartData();
    </script>
</body>

</html>
