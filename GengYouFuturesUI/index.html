<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        pre {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
        }

        .highlight-green {
            color: green;
        }

        .highlight-red {
            color: red;
        }

        .iframe-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        iframe {
            flex: 1;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .iframe-container {
                flex-direction: column;
            }

            iframe {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <h1>Index Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <div id="log"></div>

    <div class="iframe-container">
        <iframe src="http://localhost:8000/LongShort.html" title="Long Short Strategy"></iframe>
        <iframe src="http://localhost:8000/BidOffer.html" title="Bid Offer Strategy"></iframe>
    </div>

    <script>
        const logDiv = document.getElementById("log");
        const priceChangeDiv = document.getElementById("price-change");

        async function fetchIndexData() {
            try {
                const response = await fetch("http://localhost:8080/index-data");
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const indexData = await response.json();
                updateIndexUI(indexData);
            } catch (error) {
                console.error("Error fetching index data:", error);
                appendLog("Error fetching index data: " + error.message, true);
            } finally {
                setTimeout(fetchIndexData, 3000); // 控制刷新頻率
            }
        }
        function updateIndexUI(indexData) {
            if (!indexData || typeof indexData.StrategyConfig !== "object") {
                appendLog("Invalid index data structure", true);
                return;
            }

            const {
                ClosingKeyPriceLevel = "N/A",
                BidOfferLongShortThreshold = "N/A",
                BidOfferLongShortExtremeValue = "N/A",
                MaximumLoss = "N/A",
                StrategyMode = "N/A",
            } = indexData.StrategyConfig;

            const {
                MtxPrices = "N/A",
                ClosedProfitLoss = "N/A",
                FutureRight = "N/A",
                Diff = "N/A",
                LongShort = "N/A",
                TransactionListLongShort = "N/A",
                NumberOfStocksRisingAndFalling = "N/A"
            } = indexData.MarketData;

            const dayAmpAndKeyPrice = indexData.MarketData.DayAmpAndKeyPrice || {};
            const openInterestInfo = indexData.OpenInterestInfo || {};

            const uiContent = `
        <div class="ui-section">
            <h3>Strategy Config</h3>
            <p><strong>Strategy Mode:</strong> ${StrategyMode}</p>
            <p><strong>BidOfferLongShortThreshold:</strong> $${BidOfferLongShortThreshold}</p>
            <p><strong>BidOfferLongShortExtremeValue:</strong> $${BidOfferLongShortExtremeValue}</p>
            <p><strong>Closing Key Price Level:</strong> $${ClosingKeyPriceLevel}</p>
            <p><strong>Maximum Loss:</strong> $${MaximumLoss}</p>
        </div>

        <div class="ui-section">
            <h3>Market Data</h3>
            <p><strong>Mtx Prices:</strong> $${MtxPrices}</p>
            <p><strong>Closed P/L:</strong> $${ClosedProfitLoss}</p>
            <p><strong>Future Right:</strong> $${FutureRight}</p>
            <p><strong>Diff:</strong> ${Diff}</p>
            <p><strong>Long/Short Position:</strong> ${LongShort}</p>
            <p><strong>Transaction List Long/Short:</strong> ${TransactionListLongShort}</p>
            <p><strong>Number of Stocks Rising/Falling:</strong> ${NumberOfStocksRisingAndFalling}</p>
        </div>

        <div class="ui-section">
            <h3>Day Amp and Key Price</h3>
            <p><strong>Long Key 5:</strong> ${dayAmpAndKeyPrice.LongKey5}</p>
            <p><strong>Long Key 4:</strong> ${dayAmpAndKeyPrice.LongKey4}</p>
            <p><strong>Long Key 3:</strong> ${dayAmpAndKeyPrice.LongKey3}</p>
            <p><strong>Long Key 2:</strong> ${dayAmpAndKeyPrice.LongKey2}</p>
            <p><strong>Long Key 1:</strong> ${dayAmpAndKeyPrice.LongKey1}</p>
            <p><strong>Short Key 5:</strong> ${dayAmpAndKeyPrice.ShortKey5}</p>
            <p><strong>Short Key 4:</strong> ${dayAmpAndKeyPrice.ShortKey4}</p>
            <p><strong>Short Key 3:</strong> ${dayAmpAndKeyPrice.ShortKey3}</p>
            <p><strong>Short Key 2:</strong> ${dayAmpAndKeyPrice.ShortKey2}</p>
            <p><strong>Short Key 1:</strong> ${dayAmpAndKeyPrice.ShortKey1}</p>
            <p><strong>Smallest Amp:</strong> ${dayAmpAndKeyPrice.SmallestAmp}</p>
            <p><strong>Small Amp:</strong> ${dayAmpAndKeyPrice.SmallAmp}</p>
            <p><strong>Avg Amp:</strong> ${dayAmpAndKeyPrice.AvgAmp}</p>
            <p><strong>Larger Amp:</strong> ${dayAmpAndKeyPrice.LargerAmp}</p>
            <p><strong>Largest Amp:</strong> ${dayAmpAndKeyPrice.LargestAmp}</p>
        </div>

        <div class="ui-section">
            <h3>Open Interest Info</h3>
            <p><strong>Open Position:</strong> ${openInterestInfo.OpenPosition || "N/A"}</p>
            <p><strong>Avg Cost:</strong> ${openInterestInfo.AvgCost || "N/A"}</p>
            <p><strong>Profit and Loss:</strong> ${openInterestInfo.ProfitAndLoss || "N/A"}</p>
        </div>
    `;

            // Assuming priceChangeDiv is a container element in the DOM
            priceChangeDiv.innerHTML = uiContent;

            appendLog(`[Index Data Updated] Threshold: ${BidOfferLongShortThreshold}, Closed P/L: ${ClosedProfitLoss}`);
        }



        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        fetchIndexData();
    </script>
</body>

</html>
