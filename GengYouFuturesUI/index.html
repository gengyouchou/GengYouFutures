<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        pre {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
        }

        .highlight-green {
            color: green;
        }

        .highlight-red {
            color: red;
        }

        .iframe-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        iframe {
            flex: 1;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .iframe-container {
                flex-direction: column;
            }

            iframe {
                height: 300px;
            }
        }

        .ui-section {
            margin-bottom: 20px;
        }

        .ui-section h3 {
            font-size: 1.2em;
            color: #333;
        }

        .ui-section .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            align-items: center;
        }

        .ui-section .key-value {
            font-weight: bold;
            color: #333;
        }

        .ui-section .value {
            color: #555;
        }

        .ui-section .row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            align-items: center;
        }

        .key-value.green {
            color: green;
        }

        .key-value.red {
            color: red;
        }

        .ui-section .row {
            margin-bottom: 10px;
        }

        .long-short-container {
            display: flex;
            flex-wrap: wrap;
        }

        .long-short-item {
            width: 150px;
            margin-right: 20px;
        }

        .long-short-item p {
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <h1>Index Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <div id="log"></div>

    <div class="iframe-container">
        <iframe src="http://192.168.50.168:8000/LongShort.html" title="Long Short Strategy"></iframe>
        <iframe src="http://192.168.50.168:8000/BidOffer.html" title="Bid Offer Strategy"></iframe>
    </div>

    <script>
        const logDiv = document.getElementById("log");
        const priceChangeDiv = document.getElementById("price-change");

        async function fetchIndexData() {
            try {
                const response = await fetch("http://192.168.50.168:8080/index-data");
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const indexData = await response.json();
                updateIndexUI(indexData);
            } catch (error) {
                console.error("Error fetching index data:", error);
                appendLog("Error fetching index data: " + error.message, true);
            } finally {
                setTimeout(fetchIndexData, 3000); // 控制刷新頻率
            }
        }

        function updateIndexUI(indexData) {
            if (!indexData || typeof indexData.StrategyConfig !== "object") {
                appendLog("Invalid index data structure", true);
                return;
            }

            const {
                ClosingKeyPriceLevel = "N/A",
                BidOfferLongShortThreshold = "N/A",
                BidOfferLongShortExtremeValue = "N/A",
                MaximumLoss = "N/A",
                StrategyMode = "N/A",
            } = indexData.StrategyConfig;

            const {
                MtxPrices = "N/A",
                ClosedProfitLoss = "N/A",
                FutureRight = "N/A",
                Diff = "N/A",
                LongShort = "N/A",
                TransactionListLongShort = "N/A",
                NumberOfStocksRisingAndFalling = "N/A"
            } = indexData.MarketData;

            const dayAmpAndKeyPrice = indexData.MarketData.DayAmpAndKeyPrice || {};
            const openInterestInfo = indexData.OpenInterestInfo || {};

            const uiContent = `
        <div class="ui-section">
            <h3>Strategy Config</h3>
            <div class="grid-container">
                <span class="key-value">Strategy Mode:</span><span class="value">${StrategyMode}</span>
                <span class="key-value">BidOfferLongShortThreshold:</span><span class="value">$${BidOfferLongShortThreshold}</span>
                <span class="key-value">BidOfferLongShortExtremeValue:</span><span class="value">$${BidOfferLongShortExtremeValue}</span>
                <span class="key-value">Closing Key Price Level:</span><span class="value">$${ClosingKeyPriceLevel}</span>
                <span class="key-value">Maximum Loss:</span><span class="value">$${MaximumLoss}</span>
            </div>
        </div>

        <div class="ui-section">
            <h3>Market Data</h3>
            <div class="grid-container">
                <span class="key-value">Mtx Prices:</span><span class="value">$${MtxPrices}</span>
                <span class="key-value">Closed P/L:</span><span class="value">$${ClosedProfitLoss}</span>
                <span class="key-value">Future Right:</span><span class="value">$${FutureRight}</span>
                <span class="key-value">Diff:</span><span class="value">${Diff}</span>
                <span class="key-value">Long/Short Position:</span><span class="value">${LongShort}</span>
                <span class="key-value">Transaction List Long/Short:</span><span class="value">${TransactionListLongShort}</span>
                <span class="key-value">Number of Stocks Rising/Falling:</span><span class="value">${NumberOfStocksRisingAndFalling}</span>
            </div>
        </div>

        <div class="ui-section">
            <h3>Day Amp and Key Price</h3>
            <pre>
Long Key 5: ${dayAmpAndKeyPrice.LongKey5}
Long Key 4: ${dayAmpAndKeyPrice.LongKey4}
Long Key 3: ${dayAmpAndKeyPrice.LongKey3}
Long Key 2: ${dayAmpAndKeyPrice.LongKey2}
Long Key 1: ${dayAmpAndKeyPrice.LongKey1}
=========================================
Short Key 1: ${dayAmpAndKeyPrice.ShortKey1}
Short Key 2: ${dayAmpAndKeyPrice.ShortKey2}
Short Key 3: ${dayAmpAndKeyPrice.ShortKey3}
Short Key 4: ${dayAmpAndKeyPrice.ShortKey4}
Short Key 5: ${dayAmpAndKeyPrice.ShortKey5}
=========================================
Largest Amp: ${dayAmpAndKeyPrice.LargestAmp}
Larger Amp: ${dayAmpAndKeyPrice.LargerAmp} 
Avg Amp: ${dayAmpAndKeyPrice.AvgAmp}
Small Amp: ${dayAmpAndKeyPrice.SmallAmp} 
Smallest Amp: ${dayAmpAndKeyPrice.SmallestAmp}
            </pre>
        </div>

        <div class="ui-section">
            <h3>Open Interest Info</h3>
            <div class="grid-container">
                <span class="key-value">Open Position:</span><span class="value">${openInterestInfo.OpenPosition || "N/A"}</span>
                <span class="key-value">Avg Cost:</span><span class="value">${openInterestInfo.AvgCost || "N/A"}</span>
                <span class="key-value">Profit and Loss:</span><span class="value">${openInterestInfo.ProfitAndLoss || "N/A"}</span>
            </div>
        </div>
    `;

            // Update UI content
            priceChangeDiv.innerHTML = uiContent;

            appendLog(`[Index Data Updated] Threshold: ${BidOfferLongShortThreshold}, Closed P/L: ${ClosedProfitLoss}`);
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        fetchIndexData();
    </script>
</body>

</html>
