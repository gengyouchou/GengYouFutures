<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Futures Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        canvas {
            width: 100%;
            height: 500px;
            margin: 20px auto;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Real-time Futures Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <canvas id="chart"></canvas>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById("log");
        const chartCtx = document.getElementById("chart").getContext("2d");
        const priceChangeDiv = document.getElementById("price-change");

        const chartData = {
            labels: [],
            datasets: [{
                label: "Current Price",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                borderWidth: 2,
                fill: true,
            }]
        };

        const lineChart = new Chart(chartCtx, {
            type: "line",
            data: chartData,
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true }
                },
                scales: {
                    x: { title: { display: true, text: "Time" } },
                    y: { title: { display: true, text: "Price" } }
                }
            }
        });

        async function fetchData() {
            try {
                const response = await fetch("http://192.168.50.168:8080/");
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog("Error fetching data: " + error.message, true);
                setTimeout(fetchData, 5000);
            }
        }

        function updateUI(data) {
            const { CurrentPrice, Time, Symbol, ClosedProfitLoss, FutureRight } = data;

            const timeLabel = new Date(Time * 1000).toLocaleTimeString();
            chartData.labels.push(timeLabel);
            chartData.datasets[0].data.push(CurrentPrice);
            lineChart.update();

            priceChangeDiv.textContent = `Price Change: $${CurrentPrice} | Closed Profit: $${ClosedProfitLoss} | Future Right: $${FutureRight}`;

            appendLog(`[${Symbol}] Time: ${timeLabel}, Price: $${CurrentPrice}, Closed Profit: $${ClosedProfitLoss}`);
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>

</html>
