<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #price-change {
            text-align: center;
            font-size: 1.5em;
            margin: 20px;
            font-weight: bold;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        pre {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
        }

        .highlight-green {
            color: green;
        }

        .highlight-red {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Index Data Viewer</h1>
    <div id="price-change">Price Change: N/A</div>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById("log");
        const priceChangeDiv = document.getElementById("price-change");

        async function fetchIndexData() {
            try {
                const response = await fetch("http://localhost:8080/index-data");
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const indexData = await response.json();
                updateIndexUI(indexData);
            } catch (error) {
                console.error("Error fetching index data:", error);
                appendLog("Error fetching index data: " + error.message, true);
            } finally {
                setTimeout(fetchIndexData, 3000); // 控制刷新頻率
            }
        }

        function updateIndexUI(indexData) {
            if (!indexData || typeof indexData.StrategyConfig !== "object") {
                appendLog("Invalid index data structure", true);
                return;
            }

            const {
                ClosingKeyPriceLevel = "N/A",
                BidOfferLongShortThreshold = "N/A",
                BidOfferLongShortExtremeValue = "N/A",
                MaximumLoss = "N/A",
                StrategyMode = "N/A",
            } = indexData.StrategyConfig;

            const {
                MtxPrices = "N/A",
                ClosedProfitLoss = "N/A",
                FutureRight = "N/A"
            } = indexData.MarketData;

            priceChangeDiv.textContent = `
                MtxPrices: $${MtxPrices} | 
                ClosingKeyPriceLevel: $${ClosingKeyPriceLevel} | 
                Threshold: $${BidOfferLongShortThreshold} | 
                Extreme Value: $${BidOfferLongShortExtremeValue} | 
                FutureRight: $${FutureRight} | 
                Closed P/L: $${ClosedProfitLoss} | 
                Max Loss: $${MaximumLoss} |
                Mode: ${StrategyMode}
            `;

            appendLog(`[Index Data Updated] Threshold: ${BidOfferLongShortThreshold}, Closed P/L: ${ClosedProfitLoss}`);
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        fetchIndexData();
    </script>
</body>

</html>
