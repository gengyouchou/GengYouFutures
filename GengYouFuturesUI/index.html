<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Futures Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        canvas {
            max-width: 100%;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <h1>Real-time Futures Data Viewer</h1>
    <div id="log"></div>
    <canvas id="chart"></canvas>

    <script>
        const logDiv = document.getElementById("log");
        const chartCtx = document.getElementById("chart").getContext("2d");

        // Line chart setup
        const chartData = {
            labels: [], // Timestamps
            datasets: [{
                label: "Price",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                borderWidth: 2,
                fill: true,
            }]
        };

        const chartOptions = {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                },
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Timestamp"
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: "Price"
                    }
                }
            }
        };

        const lineChart = new Chart(chartCtx, {
            type: "line",
            data: chartData,
            options: chartOptions,
        });

        // Fetch data from the server
        async function fetchData() {
            console.log("Fetching data..."); // Debugging: Indicate fetch attempt
            try {
                const response = await fetch("http://localhost:8080/");
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                console.log("Data fetched successfully!"); // Debugging: Successful fetch

                const data = await response.json();
                updateUI(data); // Process data
            } catch (error) {
                console.error("Error fetching data:", error); // Debugging: Error message
                appendLog("Error fetching data: " + error.message);

                // Retry fetching data after 5 seconds
                console.log("Retrying fetch in 5 seconds..."); // Debugging: Retry message
                setTimeout(fetchData, 5000);
            }
        }
        function updateUI(data) {
            console.log("Updating UI with new data..."); // Debugging: UI update start

            // Log the full data object for debugging
            console.log("Fetched data:", data);

            // Ensure 'data' is an object and 'data' is an array inside the object
            if (data && Array.isArray(data.data)) {
                data.data.forEach((message, index) => {
                    console.log("Processing message #" + (index + 1));  // Log the index (1-based)

                    // Log the raw message data
                    console.log("Raw message data:", message);

                    // Check if expected fields are present
                    const { price, volume, symbol } = message;
                    if (price === undefined || volume === undefined || symbol === undefined) {
                        console.warn(`Missing data in message #${index + 1}:`, message);
                    }

                    // Log the data (without time)
                    appendLog(`Message #${index + 1}: Symbol: ${symbol}, Price: ${price}, Volume: ${volume}`);

                    // Update chart (just use the price as before)
                    chartData.labels.push(`Message #${index + 1}`);
                    chartData.datasets[0].data.push(price);

                    // Limit the chart to the last 50 data points
                    if (chartData.labels.length > 50) {
                        chartData.labels.shift();
                        chartData.datasets[0].data.shift();
                    }
                });
            } else {
                console.error("Fetched data is not in the expected format:", data);
                appendLog("Error: Fetched data is not in the expected format.");
            }

            console.log("UI updated with new data!"); // Debugging: UI update complete
            lineChart.update(); // Update the chart with the new data
        }


        // Append log to the logDiv and keep it scrolled to the bottom
        function appendLog(message) {
            const newLogEntry = document.createElement("div");
            newLogEntry.textContent = message;
            logDiv.appendChild(newLogEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Retry fetching data every 3 seconds
        setInterval(fetchData, 3000);

        // Initial data fetch
        fetchData();
    </script>
</body>

</html>
