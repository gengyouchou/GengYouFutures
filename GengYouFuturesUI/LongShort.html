<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongShort & BidOffer Slope Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #222;
            color: #fff;
        }

        h1 {
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            background-color: #333;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <canvas id="longShortChart"></canvas>
    <canvas id="bidOfferSlopeChart"></canvas>

    <script>
        Chart.register(ChartZoom);

        const longShortChartCtx = document.getElementById("longShortChart").getContext("2d");
        const bidOfferSlopeChartCtx = document.getElementById("bidOfferSlopeChart").getContext("2d");

        const chartConfigs = [
            {
                ctx: longShortChartCtx,
                data: { labels: [], datasets: [{ label: "LongShort", data: [], borderColor: "green", borderWidth: 1, tension: 0.4, pointRadius: 0 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true },
                        tooltip: { mode: "index", intersect: false },
                        zoom: {
                            pan: { enabled: true, mode: 'x' },
                            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, drag: { enabled: true }, mode: 'x' }
                        }
                    },
                    scales: { x: { title: { display: true, text: "Time" } }, y: { title: { display: true, text: "LongShort Value" } } }
                }
            },
            {
                ctx: bidOfferSlopeChartCtx,
                data: { labels: [], datasets: [{ label: "BidOfferLongShortSlope", data: [], borderColor: "red", borderWidth: 1, tension: 0.4, pointRadius: 0 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true },
                        tooltip: { mode: "index", intersect: false },
                        zoom: {
                            pan: { enabled: true, mode: 'x' },
                            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, drag: { enabled: true }, mode: 'x' }
                        }
                    },
                    scales: { x: { title: { display: true, text: "Time" } }, y: { title: { display: true, text: "BidOffer Slope Value" } } }
                }
            }
        ];

        const [longShortChart, bidOfferSlopeChart] = chartConfigs.map(config => new Chart(config.ctx, { type: "line", data: config.data, options: config.options }));

        async function fetchData() {
            try {
                // 从当前 URL 中获取 commodity 参数
                const urlParams = new URLSearchParams(window.location.search);
                const commodity = urlParams.get("commodity");

                // 构造带参数的请求 URL
                const response = await fetch(`http://192.168.50.168:8080/Long-Short-Cache-data?commodity=${commodity}`);
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();

                updateUI(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }

        function resetChartData(chartData) {
            // 清空圖表資料
            chartData.labels.length = 0;
            chartData.datasets[0].data.length = 0;
        }

        function batchUpdateChartData(chartData, labels, values) {
            // 批次更新資料
            chartData.labels.push(...labels);
            chartData.datasets[0].data.push(...values);

            // 保持資料長度限制
            if (chartData.labels.length > MAX_DATA_LENGTH) {
                const excess = chartData.labels.length - MAX_DATA_LENGTH;
                chartData.labels.splice(0, excess);
                chartData.datasets[0].data.splice(0, excess);
            }
        }

        function updateUI(data) {
            if (!Array.isArray(data) || data.length === 0) {
                appendLog("Error: Invalid or empty data format.", true);
                return;
            }

            // 收集更新資料
            const longShortLabels = [];
            const longShortValues = [];
            const bidOfferSlopeLabels = [];
            const bidOfferSlopeValues = [];

            data.forEach(point => {
                const { timestamp, CurLongShort, CurBidOfferLongShortSlope } = point;
                longShortLabels.push(timestamp);
                longShortValues.push(CurLongShort);
                bidOfferSlopeLabels.push(timestamp);
                bidOfferSlopeValues.push(CurBidOfferLongShortSlope);
            });

            // 清空並更新圖表資料
            resetChartData(longShortChart.data);
            batchUpdateChartData(longShortChart.data, longShortLabels, longShortValues);

            resetChartData(bidOfferSlopeChart.data);
            batchUpdateChartData(bidOfferSlopeChart.data, bidOfferSlopeLabels, bidOfferSlopeValues);

            // 更新圖表一次
            longShortChart.update();
            bidOfferSlopeChart.update();

            // 日誌顯示最新資料
            const latestPoint = data[data.length - 1];
            appendLog(`[Time: ${latestPoint.timestamp}] LongShort: ${latestPoint.CurLongShort}, BidOfferSlope: ${latestPoint.CurBidOfferLongShortSlope}`);
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";

            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;

            while (logDiv.childNodes.length > MAX_LOG_ENTRIES) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        setInterval(fetchData, 10000);
    </script>
</body>

</html>
