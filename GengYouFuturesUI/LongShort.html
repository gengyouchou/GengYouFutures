<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongShort & BidOffer Slope Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 整體頁面採用黑色背景，文字為白色 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #000;
            color: #fff;
        }

        h1 {
            text-align: center;
        }

        /* Canvas 以黑色調為背景 */
        canvas {
            width: 100%;
            height: 300px;
            margin: 20px auto;
            background-color: #222;
        }

        /* 日誌區塊，方便查看更新訊息 */
        #log {
            height: 200px;
            overflow-y: auto;
            background-color: #333;
            color: #fff;
            margin: 20px auto;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <canvas id="longShortChart"></canvas>
    <canvas id="bidOfferSlopeChart"></canvas>
    <div id="log"></div>

    <script>
        // 取得 URL 中的 commodity 參數，並根據此參數更新大標題
        const urlParams = new URLSearchParams(window.location.search);
        const commodity = urlParams.get("commodity");
        if (commodity) {
            document.querySelector("h1").textContent = `${commodity} - LongShort & BidOffer Slope Viewer`;
        }

        const logDiv = document.getElementById("log");
        const longShortChartCtx = document.getElementById("longShortChart").getContext("2d");
        const bidOfferSlopeChartCtx = document.getElementById("bidOfferSlopeChart").getContext("2d");

        const MAX_DATA_LENGTH = 20000; // 控制圖表數據長度
        const MAX_LOG_ENTRIES = 100;     // 控制日誌條數

        // 定義兩個圖表的設定，包含 interaction 與 tooltip 的精細顯示（四位小數）
        const chartConfigs = [
            {
                ctx: longShortChartCtx,
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "LongShort",
                            data: [],
                            borderColor: "green",
                            borderWidth: 1,
                            tension: 0.4,
                            pointRadius: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: true },
                        tooltip: {
                            mode: "index",
                            intersect: false,
                            callbacks: {
                                label: function (context) {
                                    let label = context.dataset.label || "";
                                    if (label) label += ": ";
                                    if (context.parsed.y !== null) {
                                        label += parseFloat(context.parsed.y).toFixed(4);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: "Time" } },
                        y: { title: { display: true, text: "LongShort Value" } }
                    }
                }
            },
            {
                ctx: bidOfferSlopeChartCtx,
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "BidOfferLongShortSlope",
                            data: [],
                            borderColor: "red",
                            borderWidth: 1,
                            tension: 0.4,
                            pointRadius: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: true },
                        tooltip: {
                            mode: "index",
                            intersect: false,
                            callbacks: {
                                label: function (context) {
                                    let label = context.dataset.label || "";
                                    if (label) label += ": ";
                                    if (context.parsed.y !== null) {
                                        label += parseFloat(context.parsed.y).toFixed(4);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: "Time" } },
                        y: { title: { display: true, text: "BidOffer Slope Value" } }
                    }
                }
            }
        ];

        const [longShortChart, bidOfferSlopeChart] = chartConfigs.map(config =>
            new Chart(config.ctx, { type: "line", data: config.data, options: config.options })
        );

        async function fetchData() {
            try {
                // 從 URL 中取得 commodity 參數 (已於上方取得)
                const response = await fetch(`http://192.168.50.168:8080/Long-Short-Cache-data?commodity=${commodity}`);
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }

        function resetChartData(chartData) {
            chartData.labels.length = 0;
            chartData.datasets[0].data.length = 0;
        }

        function batchUpdateChartData(chartData, labels, values) {
            chartData.labels.push(...labels);
            chartData.datasets[0].data.push(...values);
            if (chartData.labels.length > MAX_DATA_LENGTH) {
                const excess = chartData.labels.length - MAX_DATA_LENGTH;
                chartData.labels.splice(0, excess);
                chartData.datasets[0].data.splice(0, excess);
            }
        }

        function updateUI(data) {
            if (!Array.isArray(data) || data.length === 0) {
                appendLog("Error: Invalid or empty data format.", true);
                return;
            }

            const longShortLabels = [];
            const longShortValues = [];
            const bidOfferSlopeLabels = [];
            const bidOfferSlopeValues = [];

            data.forEach(point => {
                const { timestamp, CurLongShort, CurBidOfferLongShortSlope } = point;
                longShortLabels.push(timestamp);
                longShortValues.push(CurLongShort);
                bidOfferSlopeLabels.push(timestamp);
                bidOfferSlopeValues.push(CurBidOfferLongShortSlope);
            });

            resetChartData(longShortChart.data);
            batchUpdateChartData(longShortChart.data, longShortLabels, longShortValues);

            resetChartData(bidOfferSlopeChart.data);
            batchUpdateChartData(bidOfferSlopeChart.data, bidOfferSlopeLabels, bidOfferSlopeValues);

            longShortChart.update();
            bidOfferSlopeChart.update();

            const latestPoint = data[data.length - 1];
            appendLog(`[Time: ${latestPoint.timestamp}] LongShort: ${latestPoint.CurLongShort}, BidOfferSlope: ${latestPoint.CurBidOfferLongShortSlope}`);
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            while (logDiv.childNodes.length > MAX_LOG_ENTRIES) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        setInterval(fetchData, 10000);
    </script>
</body>

</html>
