<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LongShort & BidOffer Slope Viewer</title>

    <!-- 載入 Chart.js v3.9.1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- 載入 chartjs-plugin-zoom v1.2.1 -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #222;
            color: #fff;
        }

        h1 {
            text-align: center;
        }

        /* 固定 canvas 高度，避免高度自動為 0 */
        canvas {
            max-width: 100%;
            height: 400px;
            background-color: #333;
            margin-bottom: 30px;
        }

        #logDiv {
            height: 200px;
            overflow-y: auto;
            background: #444;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <canvas id="longShortChart"></canvas>
    <canvas id="bidOfferSlopeChart"></canvas>
    <div id="logDiv"></div>

    <script>
        // 對於 Chart.js v3，當載入 chartjs-plugin-zoom v1.2.1 後，外掛會自動註冊
        // 如有需要，也可手動呼叫：Chart.register(ChartZoom);

        const MAX_DATA_LENGTH = 1000;  // 限制圖表資料筆數
        const MAX_LOG_ENTRIES = 50;    // 限制日誌條數
        const logDiv = document.getElementById("logDiv");

        // 取得 canvas 繪圖環境
        const longShortChartCtx = document.getElementById("longShortChart").getContext("2d");
        const bidOfferSlopeChartCtx = document.getElementById("bidOfferSlopeChart").getContext("2d");

        // 建立 LongShort 圖表
        const longShortChart = new Chart(longShortChartCtx, {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                    label: "LongShort",
                    data: [],
                    borderColor: "green",
                    borderWidth: 1,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true },
                    tooltip: { mode: "index", intersect: false },
                    zoom: {
                        pan: { enabled: true, mode: 'x' },
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            drag: { enabled: true },
                            mode: 'x'
                        }
                    }
                },
                scales: {
                    x: { title: { display: true, text: "Time" } },
                    y: { title: { display: true, text: "LongShort Value" } }
                }
            }
        });

        // 建立 BidOfferSlope 圖表
        const bidOfferSlopeChart = new Chart(bidOfferSlopeChartCtx, {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                    label: "BidOfferLongShortSlope",
                    data: [],
                    borderColor: "red",
                    borderWidth: 1,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true },
                    tooltip: { mode: "index", intersect: false },
                    zoom: {
                        pan: { enabled: true, mode: 'x' },
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            drag: { enabled: true },
                            mode: 'x'
                        }
                    }
                },
                scales: {
                    x: { title: { display: true, text: "Time" } },
                    y: { title: { display: true, text: "BidOffer Slope Value" } }
                }
            }
        });

        // 抓取 API 資料並更新圖表
        async function fetchData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const commodity = urlParams.get("commodity");
                const response = await fetch(`http://192.168.50.168:8080/Long-Short-Cache-data?commodity=${commodity}`);
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }

        // 更新圖表與日誌
        function updateUI(data) {
            if (!Array.isArray(data) || data.length === 0) {
                appendLog("Error: Invalid or empty data format.", true);
                return;
            }
            const longShortLabels = [], longShortValues = [];
            const bidOfferSlopeLabels = [], bidOfferSlopeValues = [];
            data.forEach(point => {
                const { timestamp, CurLongShort, CurBidOfferLongShortSlope } = point;
                longShortLabels.push(timestamp);
                longShortValues.push(CurLongShort);
                bidOfferSlopeLabels.push(timestamp);
                bidOfferSlopeValues.push(CurBidOfferLongShortSlope);
            });
            resetChartData(longShortChart.data);
            resetChartData(bidOfferSlopeChart.data);
            batchUpdateChartData(longShortChart.data, longShortLabels, longShortValues);
            batchUpdateChartData(bidOfferSlopeChart.data, bidOfferSlopeLabels, bidOfferSlopeValues);
            longShortChart.update();
            bidOfferSlopeChart.update();
            const latestPoint = data[data.length - 1];
            appendLog(`[Time: ${latestPoint.timestamp}] LongShort: ${latestPoint.CurLongShort}, BidOfferSlope: ${latestPoint.CurBidOfferLongShortSlope}`);
        }

        // 清空圖表資料
        function resetChartData(chartData) {
            chartData.labels.length = 0;
            chartData.datasets[0].data.length = 0;
        }

        // 批次更新資料並控制最大資料長度
        function batchUpdateChartData(chartData, labels, values) {
            chartData.labels.push(...labels);
            chartData.datasets[0].data.push(...values);
            if (chartData.labels.length > MAX_DATA_LENGTH) {
                const excess = chartData.labels.length - MAX_DATA_LENGTH;
                chartData.labels.splice(0, excess);
                chartData.datasets[0].data.splice(0, excess);
            }
        }

        // 附加日誌訊息
        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            while (logDiv.childNodes.length > MAX_LOG_ENTRIES) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        // 初次抓取資料並每 10 秒重抓
        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>

</html>
