<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongShort & BidOffer Slope Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        canvas {
            width: 100%;
            height: 300px;
            margin: 20px auto;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <canvas id="longShortChart"></canvas>
    <canvas id="bidOfferSlopeChart"></canvas>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById("log");
        const longShortChartCtx = document.getElementById("longShortChart").getContext("2d");
        const bidOfferSlopeChartCtx = document.getElementById("bidOfferSlopeChart").getContext("2d");

        // 初始化圖表數據
        const MAX_DATA_LENGTH = 50; // 控制圖表數據長度
        const MAX_LOG_ENTRIES = 100; // 控制日誌長度

        const chartConfigs = [
            {
                ctx: longShortChartCtx,
                data: { labels: [], datasets: [{ label: "LongShort", data: [], borderColor: "green", borderWidth: 2, tension: 0.4 }] },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true }, tooltip: { mode: "index", intersect: false } },
                    scales: {
                        x: { title: { display: true, text: "Time" } },
                        y: { title: { display: true, text: "LongShort Value" } }
                    }
                }
            },
            {
                ctx: bidOfferSlopeChartCtx,
                data: { labels: [], datasets: [{ label: "BidOfferLongShortSlope", data: [], borderColor: "red", borderWidth: 2, tension: 0.4 }] },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true }, tooltip: { mode: "index", intersect: false } },
                    scales: {
                        x: { title: { display: true, text: "Time" } },
                        y: { title: { display: true, text: "BidOffer Slope Value" } }
                    }
                }
            }
        ];

        const [longShortChart, bidOfferSlopeChart] = chartConfigs.map(config => new Chart(config.ctx, { type: "line", data: config.data, options: config.options }));

        // 更新圖表數據
        async function fetchData() {
            try {
                const response = await fetch("http://localhost:8080/Long-Short-Cache-data");
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();

                updateUI(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }

        // 更新圖表數據並截斷
        function updateChartData(chartData, newLabel, newValue) {
            chartData.labels.push(newLabel);
            chartData.datasets[0].data.push(newValue);

            if (chartData.labels.length > MAX_DATA_LENGTH) {
                chartData.labels.shift();
                chartData.datasets[0].data.shift();
            }
        }

        // 更新 UI
        function updateUI(data) {
            const { MarketData } = data;
            if (!MarketData) {
                appendLog("Error: Missing MarketData field in response.", true);
                return;
            }

            if (!MarketData.Updating) {
                appendLog("Info: Updating is FALSE, skipping chart update.");
                return;
            }

            const { LongShort, BidOfferLongShortSlope, CurServerTime } = MarketData;
            if (!CurServerTime || CurServerTime.length !== 3) {
                appendLog("Error: Invalid CurServerTime format.", true);
                return;
            }

            const timeLabel = `${CurServerTime[0].toString().padStart(2, "0")}:${CurServerTime[1].toString().padStart(2, "0")}:${CurServerTime[2].toString().padStart(2, "0")}`;

            updateChartData(longShortChart.data, timeLabel, LongShort);
            updateChartData(bidOfferSlopeChart.data, timeLabel, BidOfferLongShortSlope);

            longShortChart.update();
            bidOfferSlopeChart.update();

            appendLog(`[Time: ${timeLabel}] LongShort: ${LongShort}, BidOfferSlope: ${BidOfferLongShortSlope}`);
        }

        // 日誌管理
        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";

            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;

            while (logDiv.childNodes.length > MAX_LOG_ENTRIES) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        // 啟動數據輪詢
        setInterval(fetchData, 2000);
    </script>
</body>

</html>
