<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongShort & BidOffer Slope Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        canvas {
            width: 100%;
            height: 300px;
            margin: 20px auto;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <canvas id="longShortChart"></canvas>
    <canvas id="bidOfferSlopeChart"></canvas>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById("log");
        const longShortChartCtx = document.getElementById("longShortChart").getContext("2d");
        const bidOfferSlopeChartCtx = document.getElementById("bidOfferSlopeChart").getContext("2d");

        // 初始化圖表數據
        const longShortData = {
            labels: [],
            datasets: [{
                label: "LongShort",
                data: [],
                borderColor: "green",
                borderWidth: 2
            }]
        };

        const bidOfferSlopeData = {
            labels: [],
            datasets: [{
                label: "BidOfferLongShortSlope",
                data: [],
                borderColor: "red",
                borderWidth: 2
            }]
        };

        // 恢復數據 (從 localStorage)
        function restoreData() {
            const storedLongShort = localStorage.getItem("longShortData");
            const storedBidOfferSlope = localStorage.getItem("bidOfferSlopeData");

            if (storedLongShort) {
                const parsedLongShort = JSON.parse(storedLongShort);
                longShortData.labels = parsedLongShort.labels;
                longShortData.datasets[0].data = parsedLongShort.data;
            }

            if (storedBidOfferSlope) {
                const parsedBidOfferSlope = JSON.parse(storedBidOfferSlope);
                bidOfferSlopeData.labels = parsedBidOfferSlope.labels;
                bidOfferSlopeData.datasets[0].data = parsedBidOfferSlope.data;
            }
        }

        // 儲存數據到 localStorage
        function saveData() {
            localStorage.setItem("longShortData", JSON.stringify({
                labels: longShortData.labels,
                data: longShortData.datasets[0].data
            }));

            localStorage.setItem("bidOfferSlopeData", JSON.stringify({
                labels: bidOfferSlopeData.labels,
                data: bidOfferSlopeData.datasets[0].data
            }));
        }

        restoreData();

        // 初始化圖表
        const longShortChart = new Chart(longShortChartCtx, {
            type: "line",
            data: longShortData,
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true },
                    tooltip: { mode: "index", intersect: false }
                },
                scales: {
                    x: { title: { display: true, text: "Time" } },
                    y: { title: { display: true, text: "LongShort" } }
                }
            }
        });

        const bidOfferSlopeChart = new Chart(bidOfferSlopeChartCtx, {
            type: "line",
            data: bidOfferSlopeData,
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true },
                    tooltip: { mode: "index", intersect: false }
                },
                scales: {
                    x: { title: { display: true, text: "Time" } },
                    y: { title: { display: true, text: "BidOffer Slope" } }
                }
            }
        });

        // 更新 UI
        async function fetchData() {
            try {
                const indexDataResponse = await fetch("http://localhost:8080/index-data");
                if (!indexDataResponse.ok) throw new Error(`HTTP status: ${indexDataResponse.status}`);
                const indexData = await indexDataResponse.json();

                updateUI(indexData);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog("Error fetching data: " + error.message, true);
                setTimeout(fetchData, 5000);
            }
        }

        function updateUI(data) {
            const { MarketData } = data;
            if (!MarketData) {
                appendLog("Error: Missing MarketData field in response.", true);
                return;
            }

            const { LongShort, BidOfferLongShortSlope, CurServerTime } = MarketData;

            if (!CurServerTime || !Array.isArray(CurServerTime) || CurServerTime.length !== 3) {
                appendLog("Error: Invalid CurServerTime format. Expected [hour, minute, second].", true);
                return;
            }

            const timeLabel = `${CurServerTime[0].toString().padStart(2, "0")}:${CurServerTime[1].toString().padStart(2, "0")}:${CurServerTime[2].toString().padStart(2, "0")}`;

            longShortData.labels.push(timeLabel);
            longShortData.datasets[0].data.push(LongShort);
            longShortChart.update();

            bidOfferSlopeData.labels.push(timeLabel);
            bidOfferSlopeData.datasets[0].data.push(BidOfferLongShortSlope);
            bidOfferSlopeChart.update();

            appendLog(`[Time: ${timeLabel}] LongShort: ${LongShort}, BidOfferSlope: ${BidOfferLongShortSlope}`);

            saveData(); // 儲存最新的數據到 localStorage
        }

        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        setInterval(fetchData, 1000);
        fetchData();
    </script>
</body>

</html>
