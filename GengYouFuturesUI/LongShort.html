<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongShort & BidOffer Slope Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        canvas {
            width: 100%;
            height: 300px;
            margin: 20px auto;
        }

        /* 隱藏 log 區域 */
        #log {
            display: none;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <canvas id="longShortChart"></canvas>
    <canvas id="bidOfferSlopeChart"></canvas>

    <script>
        const logDiv = document.getElementById("log");
        const longShortChartCtx = document.getElementById("longShortChart").getContext("2d");
        const bidOfferSlopeChartCtx = document.getElementById("bidOfferSlopeChart").getContext("2d");

        const MAX_DATA_LENGTH = 20000; // 控制圖表數據長度
        const MAX_LOG_ENTRIES = 100; // 控制日誌長度

        const chartConfigs = [
            {
                ctx: longShortChartCtx,
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "LongShort",
                            data: [],
                            borderColor: "green",
                            borderWidth: 1, // 線條變細
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true }, tooltip: { mode: "index", intersect: false } },
                    scales: {
                        x: { title: { display: true, text: "Time" } },
                        y: { title: { display: true, text: "LongShort Value" } }
                    }
                }
            },
            {
                ctx: bidOfferSlopeChartCtx,
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "BidOfferLongShortSlope",
                            data: [],
                            borderColor: "red",
                            borderWidth: 0.5, // 線條變細
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true }, tooltip: { mode: "index", intersect: false } },
                    scales: {
                        x: { title: { display: true, text: "Time" } },
                        y: { title: { display: true, text: "BidOffer Slope Value" } }
                    }
                }
            }
        ];

        const [longShortChart, bidOfferSlopeChart] = chartConfigs.map(config => new Chart(config.ctx, { type: "line", data: config.data, options: config.options }));

        async function fetchData() {
            try {
                const response = await fetch("http://192.168.50.168:8080/Long-Short-Cache-data");
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();

                updateUI(data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }

        function batchUpdateChartData(chartData, labels, values) {
            // 批次更新 labels 和 data
            chartData.labels.push(...labels);
            chartData.datasets[0].data.push(...values);

            // 保持資料長度限制
            if (chartData.labels.length > MAX_DATA_LENGTH) {
                const excess = chartData.labels.length - MAX_DATA_LENGTH;
                chartData.labels.splice(0, excess);
                chartData.datasets[0].data.splice(0, excess);
            }
        }

        function updateUI(data) {
            if (!Array.isArray(data) || data.length === 0) {
                appendLog("Error: Invalid or empty data format.", true);
                return;
            }

            // 批次收集需要更新的資料
            const longShortLabels = [];
            const longShortValues = [];
            const bidOfferSlopeLabels = [];
            const bidOfferSlopeValues = [];

            data.forEach(point => {
                const { timestamp, gLongShort, gBidOfferLongShortSlope } = point;
                longShortLabels.push(timestamp);
                longShortValues.push(gLongShort);
                bidOfferSlopeLabels.push(timestamp);
                bidOfferSlopeValues.push(gBidOfferLongShortSlope);
            });

            // 批次更新圖表資料
            batchUpdateChartData(longShortChart.data, longShortLabels, longShortValues);
            batchUpdateChartData(bidOfferSlopeChart.data, bidOfferSlopeLabels, bidOfferSlopeValues);

            // 更新圖表一次
            longShortChart.update();
            bidOfferSlopeChart.update();

            // 取得最新一筆資料，顯示在日誌中
            const latestPoint = data[data.length - 1];
            appendLog(`[Time: ${latestPoint.timestamp}] LongShort: ${latestPoint.gLongShort}, BidOfferSlope: ${latestPoint.gBidOfferLongShortSlope}`);
        }


        function appendLog(message, isError = false) {
            const entry = document.createElement("div");
            entry.textContent = message;
            if (isError) entry.style.color = "red";

            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;

            while (logDiv.childNodes.length > MAX_LOG_ENTRIES) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        setInterval(fetchData, 2000);
    </script>
</body>

</html>
