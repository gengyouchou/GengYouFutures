<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongShort & BidOffer Slope Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #000;
            color: #e0e0e0;
        }

        h1 {
            text-align: center;
            color: #fff;
        }

        .chart-container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        canvas {
            display: block;
            background-color: #121212;
            border: 1px solid #333;
        }
    </style>
</head>

<body>
    <h1>LongShort & BidOffer Slope Viewer</h1>
    <div class="chart-container">
        <canvas id="longShortChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="bidOfferChart"></canvas>
    </div>

    <script>
        const MAX_DATA_LENGTH = 20000;
        let sharedLabels = [];

        const ctxLongShort = document.getElementById("longShortChart").getContext("2d");
        const ctxBidOffer = document.getElementById("bidOfferChart").getContext("2d");

        const longShortChart = new Chart(ctxLongShort, {
            type: 'line',
            data: { labels: [], datasets: [{ label: "CurLongShort", data: [], borderColor: "green", borderWidth: 2, tension: 0.3, pointRadius: 0 }] },
            options: { responsive: true, scales: { x: { ticks: { color: "#e0e0e0" } }, y: { ticks: { color: "#e0e0e0" } } } }
        });

        const bidOfferChart = new Chart(ctxBidOffer, {
            type: 'line',
            data: { labels: [], datasets: [{ label: "CurBidOfferLongShortSlope", data: [], borderColor: "red", borderWidth: 2, tension: 0.3, pointRadius: 0 }] },
            options: { responsive: true, scales: { x: { ticks: { color: "#e0e0e0" } }, y: { ticks: { color: "#e0e0e0" } } } }
        });

        async function fetchData() {
            try {
                const commodity = getCommodityFromURL();
                if (!commodity) {
                    throw new Error("Missing 'commodity' parameter in URL");
                }
                const response = await fetch(`http://192.168.50.168:8080/Long-Short-Cache-data?commodity=${commodity}`);
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const data = await response.json();

                const labels = data.map(point => point.timestamp);
                const longShortValues = data.map(point => point.CurLongShort);
                const bidOfferValues = data.map(point => point.CurBidOfferLongShortSlope);

                sharedLabels = labels;
                updateChart(longShortChart, labels, longShortValues);
                updateChart(bidOfferChart, labels, bidOfferValues);
            } catch (error) {
                console.error("Error fetching data:", error);
            } finally {
                setTimeout(fetchData, 10000);
            }
        }

        function updateChart(chart, labels, values) {
            chart.data.labels = labels;
            chart.data.datasets[0].data = values;
            chart.update();
        }

        fetchData();
    </script>
</body>

</html>
