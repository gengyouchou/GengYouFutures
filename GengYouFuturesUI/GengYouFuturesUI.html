<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        canvas {
            max-width: 100%;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <h1>Real-time Data Viewer</h1>
    <div id="log"></div>
    <canvas id="chart"></canvas>

    <script>
        const serverIP = "127.0.0.1"; // WebSocket Server IP
        const port = 8765;           // WebSocket Server Port
        const logDiv = document.getElementById("log");
        const chartCtx = document.getElementById("chart").getContext("2d");

        // Line chart setup
        const chartData = {
            labels: [], // Timestamps
            datasets: [{
                label: "Price",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.1)",
                borderWidth: 2,
                fill: true,
            }]
        };

        const chartOptions = {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                },
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Timestamp"
                    }
                },
                y: {
                    min: 1200, // Set minimum price range (adjust as needed)
                    max: 1300, // Set maximum price range (adjust as needed)
                    title: {
                        display: true,
                        text: "Price"
                    }
                }
            }
        };

        const lineChart = new Chart(chartCtx, {
            type: "line",
            data: chartData,
            options: chartOptions,
        });

        // WebSocket with auto-reconnect logic
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(`ws://${serverIP}:${port}`);

            ws.onopen = function () {
                console.log("WebSocket connection established");
                appendLog("WebSocket connection established.");
            };

            ws.onmessage = function (event) {
                try {
                    // Parse JSON data
                    const data = JSON.parse(event.data.trim());
                    const timestamp = new Date(data.time).toLocaleTimeString();
                    const price = parseFloat(data.price);

                    // Log data
                    appendLog(`[${timestamp}] Symbol: ${data.symbol}, Price: ${price}, Volume: ${data.volume}`);

                    // Update chart
                    chartData.labels.push(timestamp);
                    chartData.datasets[0].data.push(price);

                    // Limit the chart to the last 50 data points
                    if (chartData.labels.length > 50) {
                        chartData.labels.shift();
                        chartData.datasets[0].data.shift();
                    }

                    lineChart.update();
                } catch (error) {
                    console.error("Error parsing message:", error);
                    appendLog("Error parsing message: " + error.message);
                }
            };

            ws.onerror = function (error) {
                console.error("WebSocket error:", error);
                appendLog("WebSocket error: " + error.message);
            };

            ws.onclose = function () {
                console.log("WebSocket connection closed. Reconnecting in 3 seconds...");
                appendLog("WebSocket connection closed. Reconnecting...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Append log to the logDiv and keep it scrolled to the bottom
        function appendLog(message) {
            const newLogEntry = document.createElement("div");
            newLogEntry.textContent = message;
            logDiv.appendChild(newLogEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Start WebSocket connection
        connectWebSocket();
    </script>
</body>

</html>
