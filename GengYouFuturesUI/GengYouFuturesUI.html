<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易策略資料顯示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>交易策略資料</h1>
    <p>資料每秒自動更新中...</p>
    <table id="dataTable">
        <thead>
            <tr>
                <th>欄位名稱</th>
                <th>值</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        function formatValue(key, value) {
            // 模擬 C++ printf 格式化
            if (typeof value === 'number') {
                // 針對數字進行格式化
                if (key.includes("價格") || key.includes("金額")) {
                    return value.toFixed(2); // 顯示兩位小數
                } else if (key.includes("數量") || key.includes("量")) {
                    return Intl.NumberFormat('zh-Hant', { maximumFractionDigits: 0 }).format(value); // 加千分位
                }
            }
            return value; // 字串不作變更
        }

        async function fetchData() {
            try {
                const response = await fetch('http://192.168.50.168:8000');
                if (!response.ok) throw new Error("伺服器錯誤: " + response.status);
                const data = await response.json();

                const tableBody = document.querySelector("#dataTable tbody");
                tableBody.innerHTML = "";

                for (const key in data) {
                    const row = document.createElement("tr");
                    const cellKey = document.createElement("td");
                    const cellValue = document.createElement("td");

                    cellKey.textContent = key;
                    cellValue.textContent = formatValue(key, data[key]);

                    row.appendChild(cellKey);
                    row.appendChild(cellValue);
                    tableBody.appendChild(row);
                }
            } catch (error) {
                console.error("資料抓取失敗: ", error);
            }
        }

        setInterval(fetchData, 1000);
        window.onload = fetchData;
    </script>
</body>

</html>
