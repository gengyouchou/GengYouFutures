<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chips T-Report</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .table-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            background-color: black;
            color: white;
        }

        th,
        td {
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
        }

        .negative {
            color: red;
        }

        .positive {
            color: white;
            background-color: green;
        }

        h2 {
            text-align: center;
            margin: 20px 0 0;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">Option Chips T-Report</h1>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Call (Volume Diff)</th>
                    <th>Strike Price</th>
                    <th>Put (Volume Diff)</th>
                </tr>
            </thead>
            <tbody id="table-force"></tbody>
        </table>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch("http://localhost:8090/OptionChipsTable");
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const jsonResponse = await response.json();

                // 假設 jsonResponse 直接包含 at_the_money 和 near_the_money 資料
                const atTheMoney = jsonResponse.at_the_money;
                const nearTheMoney = jsonResponse.near_the_money;

                // 更新表格
                generateOptionTable(atTheMoney.options_data, nearTheMoney.options_data);
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }

        function generateOptionTable(atTheMoneyData, nearTheMoneyData) {
            const tableBody = document.getElementById('table-force');
            if (!tableBody) {
                console.error("Table body not found!");
                return;
            }
            tableBody.innerHTML = ""; // 清空表格內容

            // 合併 at_the_money 和 near_the_money 資料，並根據 strike_price 排序
            const allData = [];
            atTheMoneyData.forEach(row => {
                allData.push({ strike_price: row.strike_price, call_volume_diff: row.volume_difference, put_volume_diff: null });
            });
            nearTheMoneyData.forEach(row => {
                allData.push({ strike_price: row.strike_price, call_volume_diff: null, put_volume_diff: row.volume_difference });
            });

            allData.sort((a, b) => a.strike_price - b.strike_price).forEach(row => {
                const tableRow = document.createElement('tr');

                const callVolumeDiffCell = `<td class="${row.call_volume_diff < 0 ? 'negative' : 'positive'}">${row.call_volume_diff || ''}</td>`;
                const strikePriceCell = `<td>${row.strike_price}</td>`;
                const putVolumeDiffCell = `<td class="${row.put_volume_diff < 0 ? 'negative' : 'positive'}">${row.put_volume_diff || ''}</td>`;

                tableRow.innerHTML = callVolumeDiffCell + strikePriceCell + putVolumeDiffCell;
                tableBody.appendChild(tableRow);
            });
        }

        function appendLog(message, isError = false) {
            console.log(`[${isError ? "Error" : "Log"}]: ${message}`);
        }

        // 每5秒調用一次fetchData
        setInterval(fetchData, 5000);
    </script>
</body>

</html>
