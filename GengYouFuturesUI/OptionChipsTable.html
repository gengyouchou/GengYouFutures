<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chips T-Report</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .table-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            background-color: black;
            color: white;
        }

        th,
        td {
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
        }

        .negative {
            color: red;
        }

        .positive {
            color: white;
            background-color: green;
        }

        h2 {
            text-align: center;
            margin: 20px 0 0;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">Option Chips T-Report</h1>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Call (Volume Diff)</th>
                    <th>Strike Price</th>
                    <th>Put (Volume Diff)</th>
                </tr>
            </thead>
            <tbody id="table-force"></tbody>
        </table>
    </div>

    <script>
        async function loadJSON(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch ${url}: ${response.statusText}`);
            }
            return response.json();
        }

        function generateForceTable(data, tableId) {
            const tableBody = document.getElementById(tableId);
            const rows = {};

            // Organize data by strike_price
            data.forEach(row => {
                if (!rows[row.strike_price]) {
                    rows[row.strike_price] = { call: null, put: null };
                }
                rows[row.strike_price].call = row.volume_difference;
            });

            // Generate rows for table
            Object.keys(rows).sort((a, b) => a - b).forEach(strikePrice => {
                const row = rows[strikePrice];
                const callCell = `<td class="${row.call < 0 ? 'negative' : 'positive'}">${row.call || ''}</td>`;
                const strikePriceCell = `<td>${strikePrice}</td>`;
                const putCell = `<td class="${row.put < 0 ? 'negative' : 'positive'}">${row.put || ''}</td>`;

                const tableRow = document.createElement('tr');
                tableRow.innerHTML = callCell + strikePriceCell + putCell; // Adjust order here
                tableBody.appendChild(tableRow);
            });
        }


        // Load data and generate table
        loadJSON('data.json')
            .then(json => generateForceTable(json.options_data, "table-force"))
            .catch(error => console.error('Error loading JSON:', error));
    </script>
</body>

</html>
