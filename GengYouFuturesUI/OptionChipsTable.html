<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chips T-Report</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .table-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            background-color: black;
            color: white;
        }

        th,
        td {
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
        }

        .negative {
            color: red;
        }

        .positive {
            color: white;
            background-color: green;
        }

        h2 {
            text-align: center;
            margin: 20px 0 0;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">Option Chips T-Report</h1>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Call (Volume Diff)</th>
                    <th>Strike Price</th>
                    <th>Put (Volume Diff)</th>
                </tr>
            </thead>
            <tbody id="table-force"></tbody>
        </table>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch("http://localhost:8090/OptionChipsTable");
                if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
                const jsonResponse = await response.json();

                // 假設 jsonResponse 直接包含 at_the_money 和 near_the_money 資料
                const atTheMoney = jsonResponse.at_the_money;
                const nearTheMoney = jsonResponse.near_the_money;

                // 更新表格
                generateOptionTable(atTheMoney.options_data, "table-at-the-money");
                generateOptionTable(nearTheMoney.options_data, "table-near-the-money");
            } catch (error) {
                console.error("Error fetching data:", error);
                appendLog(`Error fetching data: ${error.message}`, true);
            }
        }


        function generateOptionTable(data, tableId) {
            const tableBody = document.getElementById(tableId);
            tableBody.innerHTML = ""; // 清空表格內容

            // 根據 strike_price 排序並生成表格
            data.sort((a, b) => a.strike_price - b.strike_price).forEach(row => {
                const tableRow = document.createElement('tr');

                const strikePriceCell = `<td>${row.strike_price}</td>`;
                const tradeVolumeCell = `<td>${row.tradeVolume}</td>`;
                const bidVolumeCell = `<td>${row.bid_volume}</td>`;
                const askVolumeCell = `<td>${row.ask_volume}</td>`;
                const volumeDiffCell = `<td class="${row.volume_difference < 0 ? 'negative' : 'positive'}">${row.volume_difference}</td>`;

                tableRow.innerHTML = strikePriceCell + tradeVolumeCell + bidVolumeCell + askVolumeCell + volumeDiffCell;
                tableBody.appendChild(tableRow);
            });
        }

        function appendLog(message, isError = false) {
            console.log(`[${isError ? "Error" : "Log"}]: ${message}`);
        }

        // 每5秒調用一次fetchData
        setInterval(fetchData, 5000);

    </script>


</body>

</html>
